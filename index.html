const BRAND = { navy: "#0E2340", green: "#1C9A5B", muted: "#6B7280", border: "#DFE3E8" };

function fmtBRL(n) {
  if (!isFinite(n)) return "—";
  return n.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
}
function fmtBRLkWh(n) {
  if (!isFinite(n)) return "—";
  return n.toLocaleString("pt-BR", { style: "currency", currency: "BRL", minimumFractionDigits: 2 }) + "/kWh";
}
function fmtPct(n, digits = 1) {
  if (!isFinite(n)) return "—";
  return n.toLocaleString("pt-BR", { minimumFractionDigits: digits, maximumFractionDigits: digits }) + "%";
}

function b64EncodeUnicode(str) {
  return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, (_, p1) => String.fromCharCode("0x" + p1)));
}
function b64DecodeUnicode(str) {
  return decodeURIComponent(atob(str).split("").map((c) => "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2)).join(""));
}

function irrMensal(capex, ebitdaMensal, meses) {
  if (ebitdaMensal <= 0 || capex <= 0) return null;
  const npv = (r) => {
    let total = -capex;
    for (let t = 1; t <= meses; t++) total += ebitdaMensal / Math.pow(1 + r, t);
    return total;
  };
  let lo = -0.5;
  let hi = 5;
  if (npv(lo) < 0) return null;
  if (npv(hi) > 0) return hi;
  for (let i = 0; i < 100; i++) {
    const mid = (lo + hi) / 2;
    if (npv(mid) > 0) lo = mid;
    else hi = mid;
  }
  return (lo + hi) / 2;
}

function Chip({ label, value, onChange, suffix, step = 1, bare = false }) {
  if (bare) {
    return (
      <span className="inline-flex items-center gap-1 justify-end">
        <input type="number" value={value} step={step}
          onChange={(e) => onChange(e.target.value === "" ? 0 : parseFloat(e.target.value))}
          className="bg-transparent outline-none text-sm font-semibold text-right" style={{ width: 64, color: "#111" }} />
        {suffix && <span className="text-xs" style={{ color: BRAND.muted }}>{suffix}</span>}
      </span>
    );
  }
  return (
    <div className="flex items-center gap-1.5 rounded-full px-3 py-1.5" style={{ border: `1px solid ${BRAND.border}`, background: "#F7F7F5" }}>
      <span className="text-xs" style={{ color: BRAND.muted }}>{label}</span>
      <input type="number" value={value} step={step}
        onChange={(e) => onChange(e.target.value === "" ? 0 : parseFloat(e.target.value))}
        className="bg-transparent outline-none text-xs font-semibold text-right" style={{ width: 56, color: "#111" }} />
      {suffix && <span className="text-xs font-semibold" style={{ color: "#111" }}>{suffix}</span>}
    </div>
  );
}

function SelectChip({ label, value, options, onChange, bare = false }) {
  if (bare) {
    return (
      <select value={value} onChange={(e) => onChange(e.target.value)}
        className="bg-transparent outline-none text-sm font-semibold text-right" style={{ color: "#111" }}>
        {options.map((opt) => <option key={opt} value={opt}>{opt}</option>)}
      </select>
    );
  }
  return (
    <div className="flex items-center gap-1.5 rounded-full px-3 py-1.5" style={{ border: `1px solid ${BRAND.border}`, background: "#F7F7F5" }}>
      <span className="text-xs" style={{ color: BRAND.muted }}>{label}</span>
      <select value={value} onChange={(e) => onChange(e.target.value)}
        className="bg-transparent outline-none text-xs font-semibold" style={{ color: "#111" }}>
        {options.map((opt) => <option key={opt} value={opt}>{opt}</option>)}
      </select>
    </div>
  );
}

function FieldRow({ label, children }) {
  return (
    <div className="flex items-center justify-between gap-4 py-2" style={{ borderBottom: `1px solid ${BRAND.border}` }}>
      <span className="text-xs" style={{ color: BRAND.muted }}>{label}</span>
      <div className="text-sm text-right" style={{ color: "#111" }}>{children}</div>
    </div>
  );
}

function DreRow({ label, value, bold, green }) {
  return (
    <div className="flex items-baseline justify-between py-1.5" style={{ borderBottom: bold ? "none" : `1px dashed ${BRAND.border}` }}>
      <span className="text-sm" style={{ fontWeight: bold ? 700 : 400, color: "#1A1D22" }}>{label}</span>
      <span className="text-sm" style={{ fontWeight: bold ? 700 : 500, color: green ? BRAND.green : "#1A1D22", fontVariantNumeric: "tabular-nums" }}>{value}</span>
    </div>
  );
}

function MetricCard({ label, value, sub }) {
  return (
    <div className="rounded-xl p-3" style={{ border: `1px solid ${BRAND.border}` }}>
      <div className="text-[11px] uppercase" style={{ color: BRAND.muted, letterSpacing: "0.04em" }}>{label}</div>
      <div className="text-lg mt-1" style={{ fontWeight: 700, color: "#111" }}>{value}</div>
      {sub && <div className="text-xs mt-0.5" style={{ color: BRAND.muted }}>{sub}</div>}
    </div>
  );
}

function RelatorioViabilidade() {
  const [cliente, setCliente] = useState("");
  const [cidade, setCidade] = useState("");
  const [pontoNome, setPontoNome] = useState("Ponto candidato");
  const [endereco, setEndereco] = useState("");
  const [coords, setCoords] = useState("");
  const [googleLink, setGoogleLink] = useState("");
  const [coordsAuto, setCoordsAuto] = useState(false);
  const data = new Date().toLocaleDateString("pt-BR");

  const [consultorOptions, setConsultorOptions] = useState(DEFAULT_CONSULTORES);
  const [consultor, setConsultor] = useState("");
  const [addingConsultor, setAddingConsultor] = useState(false);
  const [novoConsultorInput, setNovoConsultorInput] = useState("");

  useEffect(() => {
    if (!SHEET_WEBHOOK_URL) return;
    fetch(`${SHEET_WEBHOOK_URL}?action=consultores`)
      .then((r) => r.json())
      .then((lista) => {
        if (Array.isArray(lista) && lista.length) {
          setConsultorOptions((prev) => Array.from(new Set([...prev, ...lista])).sort());
        }
      })
      .catch(() => {
        // sem sorte pra buscar a lista salva — segue só com os nomes padrão
      });
  }, []);

  useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    const d = params.get("d");
    if (!d) return;
    try {
      const estado = JSON.parse(b64DecodeUnicode(decodeURIComponent(d)));
      if (estado.consultor) setConsultor(estado.consultor);
      if (estado.cliente) setCliente(estado.cliente);
      if (estado.cidade) setCidade(estado.cidade);
      if (estado.pontoNome) setPontoNome(estado.pontoNome);
      if (estado.endereco) setEndereco(estado.endereco);
      if (estado.coords) { setCoords(estado.coords); setCoordsAuto(true); }
      if (estado.googleLink) setGoogleLink(estado.googleLink);
      if (estado.carrosPorDia !== undefined) setCarrosPorDia(estado.carrosPorDia);
      if (estado.energiaMedia !== undefined) setEnergiaMedia(estado.energiaMedia);
      if (estado.valorVenda !== undefined) setValorVenda(estado.valorVenda);
      if (estado.valorCompra !== undefined) setValorCompra(estado.valorCompra);
      if (estado.takeRatePct !== undefined) setTakeRatePct(estado.takeRatePct);
      if (estado.impostoPct !== undefined) setImpostoPct(estado.impostoPct);
      if (estado.aluguelModo) setAluguelModo(estado.aluguelModo);
      if (estado.aluguelPct !== undefined) setAluguelPct(estado.aluguelPct);
      if (estado.aluguelFixo !== undefined) setAluguelFixo(estado.aluguelFixo);
      if (estado.opexMensal !== undefined) setOpexMensal(estado.opexMensal);
      if (estado.mesesContrato !== undefined) setMesesContrato(estado.mesesContrato);
      if (estado.tipoCarregador) setTipoCarregador(estado.tipoCarregador);
      if (estado.estruturaInclusa) setEstruturaInclusa(estado.estruturaInclusa);
      if (estado.padraoEntrada) setPadraoEntrada(estado.padraoEntrada);
      if (estado.concorrentes) setConcorrentes(estado.concorrentes);
      if (estado.leitura) setLeitura(estado.leitura);
    } catch (e) {
      // link mal formado — ignora e segue com os campos em branco
    }
  }, []);

  function handleConsultorSelect(value) {
    if (value === NOVO_CONSULTOR) {
      setAddingConsultor(true);
      return;
    }
    setConsultor(value);
  }

  function confirmarNovoConsultor() {
    const nome = novoConsultorInput.trim();
    if (!nome) { setAddingConsultor(false); return; }
    setConsultorOptions((prev) => (prev.includes(nome) ? prev : Array.from(new Set([...prev, nome])).sort()));
    setConsultor(nome);
    setAddingConsultor(false);
    setNovoConsultorInput("");
    if (SHEET_WEBHOOK_URL) {
      fetch(SHEET_WEBHOOK_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ tipo: "consultor", nome }),
      }).catch(() => {});
    }
  }

  const [addingCidade, setAddingCidade] = useState(false);
  const [novaCidadeInput, setNovaCidadeInput] = useState("");

  function handleCidadeSelect(value) {
    if (value === OUTRA_CIDADE) { setAddingCidade(true); return; }
    setCidade(value);
  }
  function confirmarNovaCidade() {
    const nome = novaCidadeInput.trim();
    setAddingCidade(false);
    setNovaCidadeInput("");
    if (nome) setCidade(nome);
  }

  function handleGoogleLink(link) {
    setGoogleLink(link);
    const patterns = [/@(-?\d+\.\d+),(-?\d+\.\d+)/, /q=(-?\d+\.\d+),(-?\d+\.\d+)/, /ll=(-?\d+\.\d+),(-?\d+\.\d+)/];
    for (const re of patterns) {
      const m = link.match(re);
      if (m) { setCoords(`${m[1]}, ${m[2]}`); setCoordsAuto(true); return; }
    }
    setCoordsAuto(false);
  }

  const mapaEmbedUrl = useMemo(() => {
    if (coordsAuto && coords) {
      const [lat, lng] = coords.split(",").map((s) => s.trim());
      if (lat && lng) return `https://www.google.com/maps?q=${lat},${lng}&z=16&output=embed`;
    }
    const placeMatch = googleLink.match(/maps\/place\/([^/]+)/);
    if (placeMatch) return `https://www.google.com/maps?q=${decodeURIComponent(placeMatch[1])}&output=embed`;
    return null;
  }, [coordsAuto, coords, googleLink]);

  const [carrosPorDia, setCarrosPorDia] = useState(6);
  const [energiaMedia, setEnergiaMedia] = useState(25);
  const [valorVenda, setValorVenda] = useState(1.59);
  const [valorCompra, setValorCompra] = useState(0.2);
  const [takeRatePct, setTakeRatePct] = useState(10);
  const [impostoPct, setImpostoPct] = useState(0);
  const [aluguelModo, setAluguelModo] = useState("Percentual");
  const [aluguelPct, setAluguelPct] = useState(0);
  const [aluguelFixo, setAluguelFixo] = useState(0);
  const [opexMensal, setOpexMensal] = useState(250);
  const [mesesContrato, setMesesContrato] = useState(120);
  const [tipoCarregador, setTipoCarregador] = useState("40 kW");
  const [estruturaInclusa, setEstruturaInclusa] = useState("Sim");
  const [padraoEntrada, setPadraoEntrada] = useState("Não");
  const diasPorMes = 30;

  const CUSTO_CARREGADOR = { "40 kW": 60000, "80 kW": 115000 };
  const CUSTO_ESTRUTURA = { Sim: 20000, Não: 0 };
  const CUSTO_PADRAO = { "70A": 5500, "125A": 14000, Não: 0 };
  const custoCarregador = CUSTO_CARREGADOR[tipoCarregador];
  const custoEstrutura = CUSTO_ESTRUTURA[estruturaInclusa];
  const custoPadrao = CUSTO_PADRAO[padraoEntrada];
  const capex = custoCarregador + custoEstrutura + custoPadrao;

  const [concorrentes, setConcorrentes] = useState([
    { nome: "", distancia: "", preco: "" },
  ]);
  const [leitura, setLeitura] = useState("");
  const [saveStatus, setSaveStatus] = useState("");
  const [saving, setSaving] = useState(false);

  const calc = useMemo(() => {
    const aluguel = aluguelModo === "Percentual" ? aluguelPct / 100 : 0;
    const imposto = impostoPct / 100;
    const takeRate = takeRatePct / 100;
    const volumeKwhMes = carrosPorDia * energiaMedia * diasPorMes;
    const receitaBruta = volumeKwhMes * valorVenda;
    const impostosValor = receitaBruta * imposto;
    const receitaLiquida = receitaBruta - impostosValor;
    const comissaoValor = receitaBruta * takeRate;
    const energiaCusto = volumeKwhMes * valorCompra;
    const aluguelValor = aluguelModo === "Fixo" ? aluguelFixo : receitaBruta * aluguel;
    const ebitda = receitaLiquida - comissaoValor - energiaCusto - opexMensal - aluguelValor;
    const ebitdaPct = receitaBruta > 0 ? (ebitda / receitaBruta) * 100 : NaN;
    const fatorVariavel = 1 - imposto - takeRate - aluguel;
    const pisoMarginal = fatorVariavel > 0 ? valorCompra / fatorVariavel : NaN;
    const capexAmortMensal = mesesContrato > 0 ? capex / mesesContrato : 0;
    const custoFixoMensal = opexMensal + capexAmortMensal + (aluguelModo === "Fixo" ? aluguelFixo : 0);
    const custoTotalMensal = energiaCusto + custoFixoMensal;
    const precoCheio = fatorVariavel > 0 && volumeKwhMes > 0 ? custoTotalMensal / (fatorVariavel * volumeKwhMes) : NaN;
    const payback = ebitda > 0 ? Math.floor(capex / ebitda) : null;
    const tirMensal = irrMensal(capex, ebitda, mesesContrato);
    const tirAnual = tirMensal !== null ? Math.pow(1 + tirMensal, 12) - 1 : null;
    return { receitaBruta, impostosValor, receitaLiquida, comissaoValor, energiaCusto, aluguelValor, ebitda, ebitdaPct, pisoMarginal, precoCheio, payback, tirAnual };
  }, [carrosPorDia, energiaMedia, valorVenda, valorCompra, aluguelModo, aluguelPct, aluguelFixo, impostoPct, takeRatePct, opexMensal, capex, mesesContrato]);

  const semLeituraDePreco = concorrentes.every((c) => !c.preco);

  function updateConcorrente(i, field, value) {
    setConcorrentes((arr) => arr.map((c, idx) => (idx === i ? { ...c, [field]: value } : c)));
  }
  function addConcorrente() { setConcorrentes((arr) => [...arr, { nome: "", distancia: "", preco: "" }]); }
  function removeConcorrente(i) { setConcorrentes((arr) => arr.filter((_, idx) => idx !== i)); }

  async function salvarOportunidade() {
    if (!SHEET_WEBHOOK_URL) {
      setSaveStatus("Ainda não configurada a URL da planilha (fale com quem administra o arquivo).");
      return;
    }
    setSaving(true);
    setSaveStatus("");
    const estadoParaReabrir = {
      consultor, cliente, cidade, pontoNome, endereco, coords, googleLink,
      carrosPorDia, energiaMedia, valorVenda, valorCompra, takeRatePct, impostoPct,
      aluguelModo, aluguelPct, aluguelFixo, opexMensal, mesesContrato,
      tipoCarregador, estruturaInclusa, padraoEntrada, concorrentes, leitura,
    };
    const linkAbrirEBaixarPDF =
      window.location.origin + window.location.pathname +
      "?d=" + encodeURIComponent(b64EncodeUnicode(JSON.stringify(estadoParaReabrir)));
    const payload = {
      tipo: "oportunidade",
      data, consultor, cliente, cidade, pontoNome, endereco, coords, googleLink,
      carrosPorDia, energiaMedia, valorVenda, valorCompra, takeRatePct, impostoPct, aluguelModo, aluguelPct, aluguelFixo,
      opexMensal, mesesContrato, tipoCarregador, estruturaInclusa, padraoEntrada, capex,
      receitaBruta: calc.receitaBruta, impostosValor: calc.impostosValor, receitaLiquida: calc.receitaLiquida,
      comissaoValor: calc.comissaoValor, energiaCusto: calc.energiaCusto, aluguelValor: calc.aluguelValor,
      ebitda: calc.ebitda, margemEbitdaPct: calc.ebitdaPct,
      retornoTirAnualPct: calc.tirAnual !== null ? calc.tirAnual * 100 : null,
      tempoDeRetornoMeses: calc.payback, pisoMarginalRSkWh: calc.pisoMarginal, precoCheioRSkWh: calc.precoCheio,
      leitura, linkAbrirEBaixarPDF,
    };
    try {
      await fetch(SHEET_WEBHOOK_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(payload),
      });
      setSaveStatus(`Enviado! Link pra reabrir e baixar o PDF depois: ${linkAbrirEBaixarPDF}`);
    } catch (e) {
      setSaveStatus("Não consegui enviar — confira sua conexão e a URL configurada.");
    }
    setSaving(false);
  }

  return (
    <div style={{ background: "#EDEDE8", minHeight: "100vh", fontFamily: "'Inter','Segoe UI',sans-serif" }}>
      <style>{`
        @media print {
          .no-print { display: none !important; }
          body { background: white !important; }
          .report-page { box-shadow: none !important; margin: 0 !important; border-radius: 0 !important; }
          input, textarea, select { border: none !important; background: transparent !important; }
          select { -webkit-appearance: none !important; appearance: none !important; padding-right: 0 !important; }
          iframe { display: none !important; }
          .page-break { page-break-after: always; break-after: page; }
        }
        @page { size: A4; margin: 12mm; }
        input:focus, textarea:focus, select:focus { outline: 2px solid ${BRAND.green}55; }
      `}</style>

      <div className="no-print flex justify-center gap-3 py-4">
        <button onClick={() => window.print()} className="rounded-full px-5 py-2 text-sm font-semibold text-white" style={{ background: BRAND.navy }}>
          Baixar em PDF
        </button>
        <button onClick={salvarOportunidade} disabled={saving} className="rounded-full px-5 py-2 text-sm font-semibold text-white" style={{ background: BRAND.green }}>
          {saving ? "Enviando..." : "Salvar oportunidade"}
        </button>
      </div>
      {saveStatus && (
        <div className="no-print flex justify-center pb-2">
          <span className="text-xs" style={{ color: BRAND.muted }}>{saveStatus}</span>
        </div>
      )}

      <div className="flex justify-center pb-10 px-4">
        <div className="report-page w-full max-w-3xl rounded-2xl overflow-hidden" style={{ background: "white", boxShadow: "0 1px 3px rgba(0,0,0,0.12)" }}>
          {/* banner / cabeçalho */}
          <div style={{ background: BRAND.navy }}>
            <div className="px-8 pt-5 flex justify-end">
              <span className="text-xs" style={{ color: "#8E99AC" }}>{data}</span>
            </div>
            <div className="flex justify-center px-8 pt-2 pb-6">
              <img src={LOGO_SRC} alt="Lumie Solar" style={{ height: 92, maxWidth: "80%", objectFit: "contain" }} />
            </div>
            <div className="px-8 pb-7">
              <h1 className="text-white text-2xl font-semibold text-center">
                Análise de viabilidade{cliente ? ` — ${cliente}` : ""}
              </h1>
            </div>
          </div>

          {/* ===================== PÁGINA 1 ===================== */}
          <div className="px-8 py-6 page-break">
            <div className="text-xs font-semibold mb-2" style={{ color: BRAND.muted, letterSpacing: "0.04em" }}>DADOS GERAIS</div>
            <div className="mb-6">
              <FieldRow label="Consultor responsável">
                {addingConsultor ? (
                  <input
                    autoFocus
                    value={novoConsultorInput}
                    onChange={(e) => setNovoConsultorInput(e.target.value)}
                    onBlur={confirmarNovoConsultor}
                    onKeyDown={(e) => e.key === "Enter" && confirmarNovoConsultor()}
                    placeholder="Digite o nome e aperte Enter"
                    className="text-sm outline-none text-right"
                    style={{ color: "#111" }}
                  />
                ) : (
                  <select
                    value={consultor}
                    onChange={(e) => handleConsultorSelect(e.target.value)}
                    className="text-sm outline-none text-right bg-transparent"
                    style={{ color: consultor ? "#111" : BRAND.muted }}
                  >
                    <option value="" disabled>selecione</option>
                    {consultorOptions.map((n) => <option key={n} value={n}>{n}</option>)}
                    <option value={NOVO_CONSULTOR}>+ Adicionar novo consultor</option>
                  </select>
                )}
              </FieldRow>
              <FieldRow label="Nome do cliente">
                <input value={cliente} onChange={(e) => setCliente(e.target.value)} placeholder="Nome do cliente"
                  className="text-sm outline-none text-right bg-transparent" style={{ color: "#111" }} />
              </FieldRow>
              <FieldRow label="Cidade">
                {addingCidade ? (
                  <input
                    autoFocus
                    value={novaCidadeInput}
                    onChange={(e) => setNovaCidadeInput(e.target.value)}
                    onBlur={confirmarNovaCidade}
                    onKeyDown={(e) => e.key === "Enter" && confirmarNovaCidade()}
                    placeholder="Digite a cidade e aperte Enter"
                    className="text-sm outline-none text-right"
                    style={{ color: "#111" }}
                  />
                ) : (
                  <select
                    value={cidade}
                    onChange={(e) => handleCidadeSelect(e.target.value)}
                    className="text-sm outline-none text-right bg-transparent"
                    style={{ color: cidade ? "#111" : BRAND.muted }}
                  >
                    <option value="" disabled>selecione</option>
                    {CIDADES_SC.map((c) => <option key={c} value={c}>{c}</option>)}
                    <option value={OUTRA_CIDADE}>Outra cidade (fora de SC ou não listada)</option>
                  </select>
                )}
              </FieldRow>
            </div>

            <div className="no-print mb-6">
              <label className="text-xs block mb-1" style={{ color: BRAND.muted }}>Link do Google Maps (cole a localização do cliente)</label>
              <input value={googleLink} onChange={(e) => handleGoogleLink(e.target.value)} placeholder="https://maps.google.com/..."
                className="text-xs w-full rounded-lg px-2 py-1.5 outline-none mb-1" style={{ border: `1px solid ${BRAND.border}`, color: "#374151" }} />
              <div className="text-xs" style={{ color: coordsAuto ? BRAND.green : "#A8AEB8" }}>
                {coordsAuto ? "Coordenadas detectadas automaticamente do link."
                  : "Cole um link que já traga coordenadas (ex.: .../@-28.46,-48.99,...) para preencher sozinho. Sem coordenadas no link, não faço geocodificação de endereço — precisaria de uma API paga do Google para isso."}
              </div>
              <input value={endereco} onChange={(e) => setEndereco(e.target.value)} placeholder="Endereço do ponto (uso interno)"
                className="text-xs w-full outline-none mt-2" style={{ color: BRAND.muted }} />
            </div>

            {/* mapa */}
            <div className="text-xs font-semibold mb-2" style={{ color: BRAND.muted, letterSpacing: "0.04em" }}>O PONTO</div>
            {mapaEmbedUrl ? (
              <div className="rounded-xl mb-2 overflow-hidden" style={{ height: 220 }}>
                <iframe
                  src={mapaEmbedUrl}
                  width="100%"
                  height="100%"
                  style={{ border: 0 }}
                  loading="lazy"
                  title="Mapa do ponto"
                />
              </div>
            ) : (
              <div className="rounded-xl mb-2 flex items-center justify-center relative overflow-hidden" style={{ height: 150, background: "linear-gradient(135deg,#E7EFE9,#DCE7DF)" }}>
                <svg width="100%" height="100%" style={{ position: "absolute", opacity: 0.5 }}>
                  <line x1="0" y1="40%" x2="100%" y2="55%" stroke="#B9C6BC" strokeWidth="6" />
                  <line x1="20%" y1="0" x2="35%" y2="100%" stroke="#B9C6BC" strokeWidth="6" />
                  <line x1="70%" y1="0" x2="60%" y2="100%" stroke="#B9C6BC" strokeWidth="6" />
                </svg>
                <div className="flex flex-col items-center z-10">
                  <div className="rounded-full flex items-center justify-center text-white text-xs font-bold" style={{ width: 26, height: 26, background: BRAND.navy }}>P</div>
                  <span className="text-xs mt-1 px-2 py-0.5 rounded-full bg-white shadow">{pontoNome}</span>
                </div>
              </div>
            )}
            <div className="text-xs mb-6" style={{ color: "#A8AEB8" }}>
              {mapaEmbedUrl
                ? "mapa ao vivo do Google Maps — na hora de gerar o PDF, o mapa pode não aparecer (impressão de mapas embutidos é limitada)."
                : "mapa ilustrativo — cole um link do Google Maps acima pra carregar o mapa real"}
            </div>

            {/* concorrência */}
            <div className="text-xs font-semibold mb-2" style={{ color: BRAND.muted, letterSpacing: "0.04em" }}>CONCORRÊNCIA AO REDOR</div>
            {semLeituraDePreco && (
              <div className="text-xs rounded-lg px-3 py-2 mb-3" style={{ background: "#F4F6F5", color: "#4B5563", border: `1px dashed ${BRAND.border}` }}>
                Nenhum concorrente com preço publicado foi encontrado ao redor deste ponto.
              </div>
            )}
            <div className="mb-2">
              <div className="grid grid-cols-12 text-[11px] uppercase pb-1" style={{ color: BRAND.muted, borderBottom: `1px solid ${BRAND.border}` }}>
                <div className="col-span-6">Concorrente</div>
                <div className="col-span-3">Distância</div>
                <div className="col-span-3 text-right">R$/kWh</div>
              </div>
              {concorrentes.map((c, i) => (
                <div key={i} className="grid grid-cols-12 items-center text-sm py-1.5" style={{ borderBottom: `1px solid ${BRAND.border}` }}>
                  <input className="col-span-6 bg-transparent outline-none" value={c.nome} onChange={(e) => updateConcorrente(i, "nome", e.target.value)} />
                  <input className="col-span-3 bg-transparent outline-none" value={c.distancia} onChange={(e) => updateConcorrente(i, "distancia", e.target.value)} />
                  <input className="col-span-2 bg-transparent outline-none text-right" placeholder="—" value={c.preco} onChange={(e) => updateConcorrente(i, "preco", e.target.value)} />
                  <button className="no-print col-span-1 text-right text-xs" style={{ color: "#C0504D" }} onClick={() => removeConcorrente(i)}>✕</button>
                </div>
              ))}
            </div>
            <button className="no-print text-xs font-semibold" style={{ color: BRAND.green }} onClick={addConcorrente}>+ adicionar concorrente</button>
          </div>

          {/* ===================== PÁGINA 2 ===================== */}
          <div className="px-8 py-6 page-break">
            <div className="text-xs font-semibold mb-3" style={{ color: BRAND.muted, letterSpacing: "0.04em" }}>SIMULAÇÃO DO INVESTIMENTO</div>
            <div className="grid grid-cols-3 gap-x-4">
              <FieldRow label="Carros/dia"><Chip value={carrosPorDia} onChange={setCarrosPorDia} bare /></FieldRow>
              <FieldRow label="kWh/recarga"><Chip value={energiaMedia} onChange={setEnergiaMedia} bare /></FieldRow>
              <FieldRow label="Venda"><Chip value={valorVenda} onChange={setValorVenda} suffix="R$/kWh" step={0.01} bare /></FieldRow>
              <FieldRow label="Compra"><Chip value={valorCompra} onChange={setValorCompra} suffix="R$/kWh" step={0.01} bare /></FieldRow>
              <FieldRow label="Take rate"><Chip value={takeRatePct} onChange={setTakeRatePct} suffix="%" step={0.5} bare /></FieldRow>
              <FieldRow label="Imposto"><Chip value={impostoPct} onChange={setImpostoPct} suffix="%" step={0.5} bare /></FieldRow>
              <FieldRow label="Aluguel"><SelectChip value={aluguelModo} options={["Percentual", "Fixo"]} onChange={setAluguelModo} bare /></FieldRow>
              <FieldRow label="Valor do aluguel">
                {aluguelModo === "Percentual"
                  ? <Chip value={aluguelPct} onChange={setAluguelPct} suffix="%" step={0.5} bare />
                  : <Chip value={aluguelFixo} onChange={setAluguelFixo} suffix="R$" step={10} bare />}
              </FieldRow>
              <FieldRow label="Opex/mês"><Chip value={opexMensal} onChange={setOpexMensal} suffix="R$" step={10} bare /></FieldRow>
              <FieldRow label="Carregador"><SelectChip value={tipoCarregador} options={["40 kW", "80 kW"]} onChange={setTipoCarregador} bare /></FieldRow>
              <FieldRow label="Horizonte"><Chip value={mesesContrato} onChange={setMesesContrato} suffix="meses" step={1} bare /></FieldRow>
              <FieldRow label="Estrutura inclusa"><SelectChip value={estruturaInclusa} options={["Sim", "Não"]} onChange={setEstruturaInclusa} bare /></FieldRow>
              <FieldRow label="Padrão de entrada"><SelectChip value={padraoEntrada} options={["70A", "125A", "Não"]} onChange={setPadraoEntrada} bare /></FieldRow>
            </div>

            <div className="mt-6 mb-2">
              <div className="text-xs" style={{ color: BRAND.muted }}>Investimento total</div>
              <div className="text-4xl" style={{ fontFamily: "inherit", fontWeight: 700, color: "#111" }}>{fmtBRL(capex)}</div>
              <div className="text-sm mt-2" style={{ color: "#374151" }}>
                <div>Carregador ({tipoCarregador}): {fmtBRL(custoCarregador)}</div>
                <div>Estrutura: {fmtBRL(custoEstrutura)}</div>
                <div>Padrão de entrada: {fmtBRL(custoPadrao)}</div>
              </div>
            </div>

            {estruturaInclusa === "Sim" && (
              <div className="rounded-xl overflow-hidden mt-5" style={{ border: `1px solid ${BRAND.border}` }}>
                <img
                  src={tipoCarregador === "80 kW" ? ESTRUTURA_REF_80KW_SRC : ESTRUTURA_REF_40KW_SRC}
                  alt="Referência da estrutura Lumie Solar"
                  className="w-full"
                  style={{ display: "block" }}
                />
                <div className="text-xs px-3 py-2" style={{ color: BRAND.muted, background: "#F7F7F5" }}>
                  Referência do modelo padrão de estrutura Lumie Solar ({tipoCarregador === "80 kW" ? "2 vagas — carregador 80 kW" : "1 vaga — carregador 40 kW"}) — o resultado final pode variar conforme o ponto.
                </div>
              </div>
            )}
          </div>

          {/* ===================== PÁGINA 3 ===================== */}
          <div className="px-8 py-6">
            <div className="text-xs font-semibold mb-1" style={{ color: BRAND.muted, letterSpacing: "0.04em" }}>PROPOSTA COMERCIAL</div>
            <h2 className="text-lg font-semibold mb-4" style={{ color: "#111" }}>DRE projetada (mensal)</h2>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div>
                <DreRow label="Receita bruta" value={fmtBRL(calc.receitaBruta)} />
                <DreRow label="(−) Impostos" value={fmtBRL(calc.impostosValor)} />
                <DreRow label="(=) Receita líquida" value={fmtBRL(calc.receitaLiquida)} bold />
                <DreRow label="(−) Comissão da plataforma" value={fmtBRL(calc.comissaoValor)} />
                <DreRow label="(−) Energia" value={fmtBRL(calc.energiaCusto)} />
                <DreRow label="(−) Custos operacionais" value={fmtBRL(opexMensal)} />
                <DreRow label="(−) Aluguel" value={fmtBRL(calc.aluguelValor)} />
                <DreRow label="EBITDA" value={fmtBRL(calc.ebitda)} bold green />
              </div>
              <div className="grid grid-cols-2 gap-3 content-start">
                <MetricCard label="Margem EBITDA" value={isFinite(calc.ebitdaPct) ? fmtPct(calc.ebitdaPct) : "—"} />
                <MetricCard label="Retorno (TIR)" value={calc.tirAnual !== null ? `${fmtPct(calc.tirAnual * 100)} a.a.` : "—"} />
                <MetricCard label="Tempo de retorno" value={calc.payback !== null ? `${calc.payback} meses` : "não recupera"} />
                <MetricCard label="Piso marginal" value={fmtBRLkWh(calc.pisoMarginal)} sub={`cheio ${fmtBRLkWh(calc.precoCheio)}`} />
              </div>
            </div>

            <div className="no-print mt-6 rounded-lg p-3 text-sm" style={{ background: "#F4F6F5", borderLeft: `3px solid ${BRAND.green}` }}>
              <div className="text-xs font-semibold mb-1" style={{ color: BRAND.muted, letterSpacing: "0.04em" }}>LEITURA DO PONTO (uso interno)</div>
              <textarea value={leitura} onChange={(e) => setLeitura(e.target.value)} placeholder="Observações sobre concorrência, acesso, fluxo do local..."
                className="w-full bg-transparent outline-none resize-none" rows={2} style={{ color: "#374151" }} />
            </div>

            <p className="text-xs mt-5 leading-relaxed" style={{ color: "#9CA3AF" }}>
              Simulação com as premissas acima, sem depreciação, em horizonte de {mesesContrato} meses. Preços de concorrentes são referência informada manualmente, não cotação em tempo real. Este documento é um retrato do estudo no momento da geração e não constitui recomendação de investimento.
            </p>
          </div>

          <div className="px-8 py-3 flex justify-between text-xs" style={{ borderTop: `1px solid ${BRAND.border}`, color: BRAND.muted }}>
            <span>Lumie Solar · Análise de viabilidade de novo ponto</span>
            <span>{data}</span>
          </div>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<RelatorioViabilidade />);
</script>
</body>
</html>
